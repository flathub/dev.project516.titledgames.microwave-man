id: dev.project516.titledgames.microwave-man
runtime: org.freedesktop.Platform
runtime-version: '25.08'
base: org.godotengine.godot.BaseApp
base-version: '4.7'
sdk: org.freedesktop.Sdk
command: godot-runner

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all

modules:
  - name: microwave-man
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/TitledGames/Microwave-Man.git
        commit: TODO-2.0.0-master-commit
      
      - type: file
        url: https://github.com/TitledGames/Microwave-Man/releases/download/2.0.0/Microwave-Man.pck
        sha256: TODO-2.0.0-x86_64-pck-sha256
        dest-filename: microwave-man.pck
        only-arches:
          - x86_64

      - type: file
        url: https://github.com/TitledGames/Microwave-Man/releases/download/2.0.0/Microwave-Man-arm64.pck
        sha256: TODO-2.0.0-arm64-pck-sha256
        dest-filename: microwave-man.pck
        only-arches:
          - aarch64
        
    build-commands:
      - install -Dm644 microwave-man.pck ${FLATPAK_DEST}/bin/godot-runner.pck
      
      - if [ "${FLATPAK_ARCH}" = x86_64 ]; then cp -r addons ${FLATPAK_DEST}/bin/; fi
      
      - install -Dm644 flathub/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 flathub/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 flathub/${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
